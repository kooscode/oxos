; C:\OXOS\extensions\oxos_igs.ini: OXOS's in-game shortcuts. Buttons held together on a controller, in any title, do one thing at once.
; One [section] per shortcut, its name any word (it shows in the log). A shortcut fires when exactly its buttons are held, no others, once until they are
; released.
;   buttons       = button names joined by +, at least two: a b x y black white ltrigger rtrigger padup paddown padleft padright start back
;                   lthumb rthumb (the sticks pressed). Triggers and the analog buttons count as held past half way.
;   action        = coldboot   power the console off and on
;                   warmboot   reset the console
;                   direct     stop the title and start target at once; without target, the dashboard
;   target        = the XBE for direct: C:\..., E:\..., F:\..., G:\..., X:\ to Z:\ or D:\ (the disc)
;   toast_message = a message shown first (optional, up to 42 characters)
;   toast_timeout = seconds the message stays up: 1 to 30 (default 2)
;   launch_delay  = seconds from the message showing (without one: from the press) to the action: 0 to 5 (default 1); 0 acts at once, without the
;                   message
; Holding B at boot starts without extensions; LT + RT + BACK + BLACK held for 3 seconds still powers the console off and on.

[dashboard]
buttons = ltrigger + rtrigger + back + black
action = coldboot
toast_message = IN GAME RESET
toast_timeout = 2
launch_delay = 1

;[ftp]
