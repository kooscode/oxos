<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="OXOS Trainers">
<!-- oxos_trainers.xbe's logo: the OXOS letters and X of kernel/splash/oxos_splash.svg over "TRAINERS". tools/svg_splash.py turns it into the scene the app
     draws with the kernel's vector renderer; the X starts in the letters' metal and turns into the green X, as in the boot splash (data-oxos-phase). -->
<defs>
<linearGradient id="metal" x1="0" y1="284" x2="0" y2="426" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#C9D3C2"/><stop offset="0.45" stop-color="#5E6B58"/><stop offset="0.5" stop-color="#2A3326"/><stop offset="1" stop-color="#6F7D67"/>
</linearGradient>
<linearGradient id="xg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F4FFE6"/><stop offset="0.5" stop-color="#C9F58A"/><stop offset="0.5" stop-color="#8BE31F"/><stop offset="1" stop-color="#3C7A0C"/>
</linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#8BE31F" stop-opacity="0"/><stop offset="1" stop-color="#8BE31F" stop-opacity="1"/>
</linearGradient>
<linearGradient id="lineR" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#8BE31F" stop-opacity="1"/><stop offset="1" stop-color="#8BE31F" stop-opacity="0"/>
</linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="30"/></filter>
</defs>
<rect width="640" height="480" fill="#000000"/>
<g transform="translate(190.40 8) scale(0.36) translate(-278 -289)">
