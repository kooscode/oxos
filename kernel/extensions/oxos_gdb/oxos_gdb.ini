; C:\OXOS\extensions\oxos_gdb.ini: OXOS's GDB debugger (oxos_gdb.xos). gdb on a PC debugs the running title, and the kernel under it, over the console's
; serial port (a debug kit, or a Modxo's serial port over USB): breakpoints, steps, watchpoints, threads, memory, the title's crashes. On the PC:
;   gdb-multiarch main.exe -ex "target extended-remote localhost:2159"      (the Modxo rig: tools/modxo/console.py log SERIAL --gdb 2159)
; gdb's library list names the kernel (oxoskrnl.elf) and the extensions (NAME.xos) by file: `set solib-search-path` to their folders loads their symbols.
; `run` starts the title again (or `set remote exec-file E:\Games\X\default.xbe` first: another XBE); gdb follows the console into each new title.
; Turn it on in C:\OXOS\oxos_extensions.ini ([oxos_gdb], enabled = yes). It loads before every title; nothing waits for gdb unless asked below.
;   wait_for_gdb = yes   the title stops at its first instruction until gdb attaches (the title's start can be debugged). Default: no.
;   title        = NAME  only the title whose path contains NAME gets gdb's title breakpoints and the wait (e.g. CdRom0, or a folder name); gdb's
;                        "monitor title NAME" changes it. Default: every title.
;   title_symbols = FILE the title's symbol file (e.g. main.exe) for gdb's library list, when gdb does not have the title as its own program (gdb
;                        then loads the symbols of each title it follows); "monitor symbols FILE" changes it. Default: none.
wait_for_gdb = no
title =
title_symbols =
