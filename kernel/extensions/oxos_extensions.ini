; C:\OXOS\oxos_extensions.ini: which kernel extensions OXOS loads, and in which order (the release's copy, from kernel/extensions/).
;
; Without this file no extension is loaded, whatever is in C:\OXOS\extensions\. One [section] per extension:
;   extension = NAME.xos   its file in C:\OXOS\extensions\ (required)
;   enabled = yes          loads it. Without this line, or with enabled = no, the extension stays off.
; Extensions load top to bottom, before each title. An extension's own settings are in C:\OXOS\extensions\NAME.ini.
; Holding B at boot starts without any extension.

; Universal Trainers: a trainer menu before a game that has a trainer (oxos_trainers.ini has its settings)
[oxos_trainers]
extension = oxos_trainers.xos
enabled = yes
