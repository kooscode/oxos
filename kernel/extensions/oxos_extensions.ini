; C:\OXOS\oxos_extensions.ini: which kernel extensions OXOS loads, and in which order (the release's copy, from kernel/extensions/).
;
; Without this file no extension is loaded, whatever is in C:\OXOS\extensions\. One [section] per extension:
;   extension = NAME.xos   its file in C:\OXOS\extensions\ (required)
;   enabled = yes          loads it. Without this line, or with enabled = no, the extension stays off.
;   logging_enabled = yes  its log lines go to C:\OXOS\log\extensions.log and a debug kernel's serial port. Without this line, or with
;                          logging_enabled = no, the extension logs nothing at all.
; Extensions load top to bottom, before each title. An extension's own settings are in C:\OXOS\extensions\NAME.ini.
; Holding B at boot starts without any extension.

; In-game shortcuts: buttons held together in any title reset the console or start an XBE (oxos_igs.ini has the shortcuts). LT + RT + BACK + BLACK goes back
; to the dashboard.
[oxos_igs]
extension = oxos_igs.xos
enabled = yes
logging_enabled = no

; Universal Trainers: a trainer menu before a game that has a trainer (oxos_trainers.ini has its settings). Off as shipped: enabled = yes turns it on.
[oxos_trainers]
extension = oxos_trainers.xos
enabled = no
logging_enabled = no
