; OXOS title patches (spec/oxos-internal/25 §3).
; Copy to OXOS\title-patches.ini on the HDD, the kernel reads it each time a title starts.
; (For exFAT disk: /C/OXOS/title-patches.ini)
; (For FATX disk:  C:\OXOS\title-patches.ini)
;
; [TITLEID]           every version of the title (the title ID in the certificate, hex)
; [TITLEID/VERSION]   only that certificate version (decimal, or 0x hex)
; name = ...          shown in the serial log
;
; patch = ADDRESS: CURRENT_BYTES > NEW_BYTES
;     As the section holding ADDRESS is loaded: when the CURRENT_BYTES are at ADDRESS, the NEW_BYTES are written
;     there. Hex bytes, spaces optional, any number on each side (NEW_BYTES may be shorter: the bytes after them are
;     left as they are). Where the CURRENT_BYTES are not there (another build of the game, or a launcher that carries
;     the title ID of the game) nothing is written. Where the NEW_BYTES are already there, nothing is written either.
;
; match = ADDRESS: CURRENT_BYTES
; patch = ADDRESS: > NEW_BYTES
;     A blind patch: for a fix whose current bytes are not known. A patch line without CURRENT_BYTES is written
;     only when the CURRENT_BYTES of the match line above it (in the same section) are at the match ADDRESS: one
;     place is checked for all of them, as Cerbios does for TOCA Race Driver 3. A blind patch without a match line
;     above it is an error. Patches with CURRENT_BYTES are always checked against their own bytes, not the match line.
;
; Entries below are the fixes Cerbios 3.1.0 applies (spec/cerbios/13 §7), with CURRENT_BYTES of 4 or more. Both
; sides of each patch have the same number of bytes, so every line shows exactly what the code reads before and
; after; NEW_BYTES is longer only where the rest of the current bytes is not known. Where a game has two releases
; (or regions) with the fix at different addresses, both are listed.

