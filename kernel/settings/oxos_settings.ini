; C:\OXOS\oxos_settings.ini: OXOS's own settings (exFAT disk: /C/OXOS/oxos_settings.ini).
; Comments go on lines of their own: a ';' after a value is part of the value.

[dashboard]
; The dashboards OXOS starts, tried in this order (dashboard_1 to dashboard_8): the first one that is on the disk starts.
; When none of them exist, kernel will load C:\xboxdash.xbe by default.
dashboard_1 = C:\evoxdash.xbe
dashboard_2 = E:\evoxdash.xbe
dashboard_3 = C:\xboxdash.xbe
dashboard_4 = C:\Dashboard\default.xbe

[launch_redirect]
; When a title starts SOURCE, OXOS starts TARGET in its place (the first matching line wins).
; Syntax: any_name = SOURCE >> TARGET
; Example: 
; xbox_live_updater = C:\xodash\xonlinedash.xbe >> E:\Apps\XBLive\default.xbe

[boot_video]
; yes = Enable Boot Video Feature / no = Disable Boot Video Feature
boot_video_enabled = yes
; a .mpg file in C:\OXOS\boot_videos\ (how to make one: docs/boot_video.md in the OXOS repository), or a full path
boot_video_file = oxos_boot_video.mpg
; no = Video plays only after power cycle / yes = Play video on regular soft reboots as well
boot_video_always = no

[toasts]
; yes = Short messages over titles (from extensions, such as the in-game shortcuts) / no = No toasts. 
enabled = yes
; yes = A toast names the video mode when a title changes it (Video Mode: 720p) / no = None.
show_video_mode = yes

[storage]
; no = An exFAT disk tells titles its file system is exFAT / yes = It says FATX, as a retail disk does (for a title that only works with FATX).
show_exfat_as_fatx = no
