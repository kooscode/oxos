; OXOS title patches (spec/oxos_internal/25 §3). Copy to OXOS\oxos_title_patches.ini on the HDD, the kernel reads it each time a title starts. (For exFAT disk:
; /C/OXOS/oxos_title_patches.ini)
; (For FATX disk:  C:\OXOS\oxos_title_patches.ini)
;
; [TITLEID]           every version of the title (the title ID in the certificate, hex)
; [TITLEID/VERSION]   only that certificate version (decimal, or 0x hex)
; name = ...          shown in the serial log
;
; patch = ADDRESS: CURRENT_BYTES > NEW_BYTES
;     As the section holding ADDRESS is loaded: when the CURRENT_BYTES are at ADDRESS, the NEW_BYTES are written there. Hex bytes, spaces optional, any number
;     on each side (NEW_BYTES may be shorter: the bytes after them are left as they are). Where the CURRENT_BYTES are not there (another build of the game, or a
;     launcher that carries the title ID of the game) nothing is written. Where the NEW_BYTES are already there, nothing is written either.
;
; match = ADDRESS: CURRENT_BYTES
; patch = ADDRESS: > NEW_BYTES
;     A blind patch: for a fix whose current bytes are not known. A patch line without CURRENT_BYTES is written only when the CURRENT_BYTES of the match line
;     above it (in the same section) are at the match ADDRESS: one place is checked for all of them. A blind patch without a match line above it is an error.
;     Patches with CURRENT_BYTES are always checked against their own bytes, not the match line.
;
; Entries below were observed in the titles' own memory (spec/oxos_internal/44): each title run under a control BIOS and under a BIOS that patches it, the
; differences read back from the title's code. OXOS fixes are marked. CURRENT_BYTES are the retail code, 4 bytes or more, and both sides of each patch have
; the same number of bytes, so every line shows exactly what the code reads before and after.

