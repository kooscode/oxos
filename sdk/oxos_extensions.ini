; C:\OXOS\oxos_extensions.ini: which kernel extensions OXOS loads, and in which order. Copy it to C:\OXOS\ on the console.
;
; Without this file no extension is loaded, whatever is in C:\OXOS\extensions\. One [section] per extension:
;   extension = NAME.xos   its file in C:\OXOS\extensions\ (required)
;   enabled = yes          loads it. Without this line, or with enabled = no, the extension stays off.
;   logging_enabled = yes  its log lines go to C:\OXOS\log\extensions.log and a debug kernel's serial port. Without this line, or with
;                          logging_enabled = no, the extension logs nothing at all.
; Extensions load top to bottom, before each title. The first one sees a title's kernel calls first: when two
; extensions hook the same function, the one higher up gets the call and passes it on to the one below.
;
; An extension's own settings and data are not in this file: they are in its own C:\OXOS\extensions\NAME.ini,
; next to NAME.xos (each example has one). Holding B at boot starts without any extension.

; the SDK's examples
[example_run_loop]
extension = example_run_loop.xos
enabled = yes
logging_enabled = yes

[example_kernel_hook]
extension = example_kernel_hook.xos
enabled = yes
logging_enabled = yes

[example_title_event]
extension = example_title_event.xos
enabled = yes
logging_enabled = yes

; one switched off: kept in the list, not loaded
[my_extension]
extension = my_extension.xos
enabled = no
