; C:\OXOS\extensions\example_title_event.ini: example_title_event's own settings and data, next to example_title_event.xos.

; SETTINGS: the keys before the first [section]. Read into memory when the extension loads, so oxos_setting() returns them
; at any time (hooks too). At most 32 settings, each value up to 255 characters.

