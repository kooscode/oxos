; C:\OXOS\oxos_extensions.ini: the kernel extensions OXOS loads, top to bottom, before each title.
; Without this file no extension is loaded. Comments go on lines of their own.

[hello]
; the file in C:\OXOS\extensions\
extension = hello.xos
; settings for the extension: any other key in its section
greeting = Hello
; Main logs every so many seconds while a title runs (0 or missing: never)
heartbeat = 10
; enabled = no keeps the section but does not load the extension
